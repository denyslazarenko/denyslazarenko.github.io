---
layout: default
---

{%- if page.use_toc -%}
  {%- if page.excerpt -%}<p class="post-lead">{{ page.excerpt | strip_html }}</p>{%- endif -%}
  <nav class="post-toc">
    <span class="section-marker">Contents</span>
    {% include toc.html html=content %}
  </nav>
{%- endif -%}

<article class="post-body">
  {{ content }}
</article>
